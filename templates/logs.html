<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Logs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background-color: #0d1117;
      color: #eaf6ff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-top: 60px;
    }
    .user-info {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #d3eaff;
      font-size: 0.95rem;
    }
    .user-info a {
      color: #ff6b6b;
      text-decoration: none;
      margin-left: 10px;
    }
    h1 {
      color: #57c8ff;
      margin-bottom: 30px;
    }
    .logs-container {
      max-height: 70vh;
      overflow-y: auto;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.9rem;
      background-color: #1e2a38;
      padding: 15px;
      border-radius: 8px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- 👤 User Info -->
  {% if session.username %}
    <div class="user-info">
      Welcome, <strong>{{ session.username }}</strong>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  {% endif %}

  <div class="container">
    <h1>📝 Application Logs</h1>

    <div class="logs-container">
      {% if logs %}
        <pre>{{ logs }}</pre>
      {% else %}
        <p>No logs available.</p>
      {% endif %}
    </div>

    <a href="{{ url_for('home') }}" class="btn btn-primary mt-4">⬅️ Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80 },
        "color": { "value": "#57c8ff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.3 },
        "size": { "value": 3 },
        "line_linked": {
          "enable": true,
          "distance": 130,
          "color": "#57c8ff",
          "opacity": 0.25,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 3,
          "direction": "none",
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "grab" },
          "onclick": { "enable": true, "mode": "repulse" }
        },
        "modes": {
          "grab": {
            "distance": 140,
            "line_linked": { "opacity": 0.5 }
          },
          "repulse": { "distance": 100 }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
