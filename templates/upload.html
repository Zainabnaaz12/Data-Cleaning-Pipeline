<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upload your dataset to clean and analyze it with our web tool.">
  <title>Upload CSV Dataset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="light-theme fade-in">

  <!-- 🔗 Include shared navbar -->
  {% include 'navbar.html' %}

  <!-- 🌸 Particles Background -->
  <div id="particles-js" style="position:fixed;width:100%;height:100%;z-index:-1;"></div>

  <!-- 🌀 Page Loader -->
  <div id="loader">
    <div class="dot-loader">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- 📤 Upload Form -->
  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card light col-md-6 shadow-lg p-4">
      <h1 class="text-center mb-4">📤 Upload Your Dataset</h1>

      <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_file') }}">
        <div class="mb-3">
          <input type="file" class="form-control" name="file" accept=".csv" required onchange="showFileName(this)">
          <small id="fileNameDisplay" class="form-text text-muted mt-1"></small>
        </div>
        <button class="btn btn-primary w-100">Upload</button>
      </form>

      <!-- ⬅ Back to Home -->
      <a href="{{ url_for('home') }}" class="btn btn-secondary w-100 mt-2">⬅ Back to Home</a>

     

  <!-- 🌌 Particles & Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80 },
        "color": { "value": "#57c8ff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.3 },
        "size": { "value": 3 },
        "line_linked": {
          "enable": true,
          "distance": 130,
          "color": "#57c8ff",
          "opacity": 0.25,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 3,
          "direction": "none",
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "grab" },
          "onclick": { "enable": true, "mode": "repulse" }
        },
        "modes": {
          "grab": {
            "distance": 140,
            "line_linked": { "opacity": 0.5 }
          },
          "repulse": { "distance": 100 }
        }
      },
      "retina_detect": true
    });
  </script>

  <script src="{{ url_for('static', filename='theme-toggle.js') }}"></script>
  <script src="{{ url_for('static', filename='transition.js') }}"></script>
  <script>
    window.addEventListener("load", () => {
      document.getElementById("loader").style.display = "none";
    });

    function showFileName(input) {
      const fileName = input.files[0]?.name || "";
      document.getElementById("fileNameDisplay").innerText = fileName ? `Selected: ${fileName}` : "";
    }
  </script>
</body>
</html>
