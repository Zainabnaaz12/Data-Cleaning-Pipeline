<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Data Cleaning App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Login</h2>

    <form method="POST" action="{{ url_for('login') }}" class="card p-4 shadow-sm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" name="username" id="username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" name="password" id="password" required>
          <div class="input-group-append">
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" tabindex="-1">
              <i class="bi bi-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success btn-block">Login</button>

      <a href="{{ url_for('register') }}" class="d-block text-center mt-2">Don't have an account? Register</a>
      <a href="#" class="d-block text-center mt-1 text-info">Forgot Password?</a>
    </form>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById("password");
      const icon = document.getElementById("eye-icon");
      
      if (pwd.type === "password") {
        pwd.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
      } else {
        pwd.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
      }
    }
  </script>
</body>
</html>
