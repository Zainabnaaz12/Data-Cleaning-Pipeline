<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Cleaning Report - Your App Name</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background-color: #f9f9f9;
            color: #2c3e50;
        }
        h1, h2, h3 { 
            color: #2c3e50; 
            margin-bottom: 15px;
        }
        ul {
            margin-bottom: 30px;
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
            line-height: 1.4;
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            margin-bottom: 20px; 
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 10px; 
            text-align: left; 
        }
        th { 
            background-color: #e4f0f6; 
            font-weight: 600;
        }
        /* Print friendly */
        @media print {
            body {
                background: white;
                color: black;
            }
            table {
                box-shadow: none;
                border: 1px solid #000;
            }
            th, td {
                border: 1px solid #000;
                padding: 6px;
            }
        }
    </style>
</head>
<body>

    <h1>Data Cleaning Report</h1>
    <p>This report summarizes the actions taken to clean the uploaded dataset.</p>

    <h2>Cleaning Actions</h2>
    <ul>
        {% for entry in cleaning_report %}
        <li><strong>{{ entry.issue }}</strong>: {{ entry.action }}</li>
        {% endfor %}
    </ul>

    <h2>Snapshot of Cleaned Dataset (Top 20 Rows)</h2>
    {{ df.to_html(index=False) }}

</body>
</html>
